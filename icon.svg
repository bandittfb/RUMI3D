<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1740"/>
      <stop offset="100%" stop-color="#0b0e1a"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <radialGradient id="seed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- triangle solid -->
  <g fill="none" stroke="url(#edge)" stroke-width="10" stroke-linejoin="round" opacity="0.95">
    <path d="M256 132 L372 360 L140 360 Z"/>
  </g>
  <!-- faint inner spokes to the seed -->
  <g stroke="#9a8cff" stroke-width="4" opacity="0.4">
    <line x1="256" y1="132" x2="256" y2="262"/>
    <line x1="372" y1="360" x2="256" y2="262"/>
    <line x1="140" y1="360" x2="256" y2="262"/>
  </g>
  <!-- seed glow -->
  <circle cx="256" cy="262" r="60" fill="url(#seed)"/>
  <circle cx="256" cy="262" r="9" fill="#fff"/>
  <!-- corner letters -->
  <g fill="#0b0e1a" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="34" text-anchor="middle">
    <circle cx="256" cy="132" r="26" fill="#4cc9f0"/><text x="256" y="144">R</text>
    <circle cx="372" cy="360" r="26" fill="#ffd166"/><text x="372" y="372">U</text>
    <circle cx="140" cy="360" r="26" fill="#f72585"/><text x="140" y="372">M</text>
  </g>
</svg>
